name: Windows launcher

# Exercises the Windows launcher's updater on a real Windows machine. The macOS
# launcher was tested locally against a real pinned clone; this one could not be.
#
# The launcher acts on the repository it lives in (%~dp0..), so each case clones
# the checkout into a scratch directory and runs THAT clone's launcher. Cloning
# from the workspace rather than from GitHub means the version under test is the
# one on this branch, and the test does not depend on the network.
#
# conda is stubbed: what is under test is whether the launcher gets a clone onto
# the right branch. Building a real environment would add minutes and test none
# of that. git, cmd.exe and the .bat itself are real.

on:
  workflow_dispatch:
  pull_request:
    paths: ["launchers/**", ".github/workflows/windows-launcher.yml"]
  push:
    paths: ["launchers/**", ".github/workflows/windows-launcher.yml"]

jobs:
  unpin:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0        # a shallow source cannot be cloned from

      - name: Stub conda onto PATH
        shell: cmd
        run: |
          mkdir "%RUNNER_TEMP%\stub"
          > "%RUNNER_TEMP%\stub\conda.bat" (
            echo @echo off
            echo if "%%1"=="env" if "%%2"=="list" ^( echo phinder                  C:\stub\envs\phinder ^& exit /b 0 ^)
            echo if "%%1"=="run" ^( echo STUB-LAUNCHED ^& exit /b 0 ^)
            echo exit /b 0
          )
          echo %RUNNER_TEMP%\stub>> "%GITHUB_PATH%"

      - name: Case 1 - a pinned (detached) clone is moved back onto its branch
        shell: cmd
        run: |
          git clone --quiet "%GITHUB_WORKSPACE%" "%RUNNER_TEMP%\c1" || exit /b 1
          cd /d "%RUNNER_TEMP%\c1"
          git checkout --quiet --detach HEAD
          git symbolic-ref -q HEAD >nul 2>nul && ( echo SETUP FAILED: not detached & exit /b 1 )
          echo --- running the clone's own launcher ---
          call "%RUNNER_TEMP%\c1\launchers\Launch pHinder.bat"
          echo --- after ---
          for /f %%B in ('git rev-parse --abbrev-ref HEAD') do set AFTER=%%B
          echo branch is now: %AFTER%
          if "%AFTER%"=="HEAD" ( echo FAIL: still detached & exit /b 1 )
          echo PASS: the pinned clone was moved onto %AFTER%

      - name: Case 2 - a clone with local edits is left alone
        shell: cmd
        run: |
          git clone --quiet "%GITHUB_WORKSPACE%" "%RUNNER_TEMP%\c2" || exit /b 1
          cd /d "%RUNNER_TEMP%\c2"
          git checkout --quiet --detach HEAD
          echo dirty>> README.md
          call "%RUNNER_TEMP%\c2\launchers\Launch pHinder.bat"
          git symbolic-ref -q HEAD >nul 2>nul && ( echo FAIL: switched despite local edits & exit /b 1 )
          echo PASS: the dirty clone was left alone
          exit /b 0

      - name: Case 3 - a commit that is not on the branch is left alone
        shell: cmd
        run: |
          git clone --quiet "%GITHUB_WORKSPACE%" "%RUNNER_TEMP%\c3" || exit /b 1
          cd /d "%RUNNER_TEMP%\c3"
          git config user.email t@t.t
          git config user.name t
          git checkout --quiet --detach HEAD
          echo local>> README.md
          git commit --quiet -am "a local commit that is not on the branch"
          for /f %%H in ('git rev-parse HEAD') do set BEFORE=%%H
          call "%RUNNER_TEMP%\c3\launchers\Launch pHinder.bat"
          for /f %%H in ('git rev-parse HEAD') do set AFTER=%%H
          if not "%BEFORE%"=="%AFTER%" ( echo FAIL: the local commit was discarded & exit /b 1 )
          echo PASS: the diverged clone was left alone
          exit /b 0

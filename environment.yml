name: pHinder
# One-command install: Python, pHinder, and its dependencies.
#
#   # from the pHinder folder:
#   conda env create -f environment.yml
#   conda activate pHinder
#   phinder-gui               # or: phinder --help
#
# (The double-click launchers in launchers/ do this for you.)
#
# pHinder is self-contained -- no other lab repository is needed.
channels:
  - conda-forge
dependencies:
  - python >=3.9
  - numpy
  - openpyxl
  - pip
  - pip:
      - -e .            # this package -> the phinder / phinder-gui commands
